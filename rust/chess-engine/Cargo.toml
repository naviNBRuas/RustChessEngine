[package]
name = "chess-engine"
version = "0.1.0"
edition = "2021"
description = "A fast, compact Rust chess engine compiled to WebAssembly for browser use."
repository = "https://github.com/your-username/RustChessEngine"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"

# Improve wasm release settings for smaller/faster builds
lto = true
codegen-units = 1
panic = "abort"
debug = false
